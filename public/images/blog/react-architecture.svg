<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0d0d0d"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e3ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#b8b5ff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- React symbol -->
  <g transform="translate(200, 200)">
    <ellipse cx="100" cy="100" rx="140" ry="50" stroke="#e5e3ff" stroke-width="6" fill="none" opacity="0.3"/>
    <ellipse cx="100" cy="100" rx="140" ry="50" stroke="#e5e3ff" stroke-width="6" fill="none" opacity="0.3" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="100" rx="140" ry="50" stroke="#e5e3ff" stroke-width="6" fill="none" opacity="0.3" transform="rotate(120 100 100)"/>
    <circle cx="100" cy="100" r="15" fill="#e5e3ff"/>
  </g>

  <!-- Architecture elements -->
  <g transform="translate(600, 150)">
    <!-- Boxes representing architecture layers -->
    <rect x="0" y="0" width="400" height="80" rx="8" fill="#1a1a1a" stroke="#e5e3ff" stroke-width="2"/>
    <text x="200" y="45" font-family="system-ui" font-size="24" fill="#e5e3ff" text-anchor="middle" font-weight="600">Components</text>

    <rect x="0" y="110" width="400" height="80" rx="8" fill="#1a1a1a" stroke="#d4d1ff" stroke-width="2"/>
    <text x="200" y="155" font-family="system-ui" font-size="24" fill="#d4d1ff" text-anchor="middle" font-weight="600">Business Logic</text>

    <rect x="0" y="220" width="400" height="80" rx="8" fill="#1a1a1a" stroke="#b8b5ff" stroke-width="2"/>
    <text x="200" y="265" font-family="system-ui" font-size="24" fill="#b8b5ff" text-anchor="middle" font-weight="600">Data Layer</text>

    <!-- Connecting lines -->
    <line x1="200" y1="80" x2="200" y2="110" stroke="#e5e3ff" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="190" x2="200" y2="220" stroke="#d4d1ff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="530" font-family="system-ui" font-size="48" fill="#e5e3ff" text-anchor="middle" font-weight="700">Building Scalable React Architectures</text>
</svg>
