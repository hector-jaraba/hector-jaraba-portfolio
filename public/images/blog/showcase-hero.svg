<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0f12"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bfa6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#6bd3ff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bfa6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6bd3ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#gradient1)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <path d="M 0 0 L 0 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 100 0 L 100 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 200 0 L 200 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 300 0 L 300 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 400 0 L 400 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 500 0 L 500 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 600 0 L 600 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 700 0 L 700 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 800 0 L 800 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 900 0 L 900 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 1000 0 L 1000 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 1100 0 L 1100 630" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 1200 0 L 1200 630" stroke="#00bfa6" stroke-width="1"/>

    <path d="M 0 0 L 1200 0" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 0 100 L 1200 100" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 0 200 L 1200 200" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 0 300 L 1200 300" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 0 400 L 1200 400" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 0 500 L 1200 500" stroke="#00bfa6" stroke-width="1"/>
    <path d="M 0 630 L 1200 630" stroke="#00bfa6" stroke-width="1"/>
  </g>

  <!-- Code window -->
  <g transform="translate(700, 200)">
    <!-- Window frame -->
    <rect x="0" y="0" width="420" height="280" rx="12" fill="#1e1e2e" stroke="#00bfa6" stroke-width="2" filter="url(#glow)"/>

    <!-- Window header -->
    <rect x="0" y="0" width="420" height="40" rx="12" fill="#2a2a3e"/>
    <rect x="0" y="28" width="420" height="12" fill="#2a2a3e"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="20" r="6" fill="#27c93f"/>

    <!-- Code content -->
    <text x="30" y="80" font-family="monospace" font-size="14" fill="#a6adc8">
      <tspan x="30" dy="0">const showcase = {</tspan>
      <tspan x="30" dy="24">  typography: true,</tspan>
      <tspan x="30" dy="24">  codeBlocks: true,</tspan>
      <tspan x="30" dy="24">  media: ['video', 'image'],</tspan>
      <tspan x="30" dy="24">  interactive: true,</tspan>
      <tspan x="30" dy="24">  accessibility: '♿'</tspan>
      <tspan x="30" dy="24">};</tspan>
    </text>

    <!-- Syntax highlighting -->
    <text x="30" y="80" font-family="monospace" font-size="14">
      <tspan fill="#c678dd">const</tspan>
      <tspan fill="#e06c75"> showcase</tspan>
      <tspan fill="#56b6c2"> = </tspan>
      <tspan fill="#abb2bf">{</tspan>
    </text>
  </g>

  <!-- Document icon -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="280" height="340" rx="8" fill="#0f1620" stroke="#00bfa6" stroke-width="3" filter="url(#glow)"/>

    <!-- Lines representing text -->
    <rect x="30" y="40" width="220" height="12" rx="4" fill="#00bfa6" opacity="0.6"/>
    <rect x="30" y="70" width="180" height="12" rx="4" fill="#6bd3ff" opacity="0.4"/>
    <rect x="30" y="100" width="200" height="12" rx="4" fill="#6bd3ff" opacity="0.4"/>
    <rect x="30" y="130" width="160" height="12" rx="4" fill="#6bd3ff" opacity="0.4"/>

    <!-- Image placeholder -->
    <rect x="30" y="170" width="220" height="120" rx="6" fill="#1e1e2e" stroke="#00bfa6" stroke-width="2"/>
    <text x="140" y="235" font-family="Arial, sans-serif" font-size="40" fill="#00bfa6" text-anchor="middle">🖼️</text>

    <!-- More text lines -->
    <rect x="30" y="310" width="200" height="8" rx="4" fill="#6bd3ff" opacity="0.3"/>
  </g>

  <!-- Feature badges -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#00bfa6" opacity="0.2" stroke="#00bfa6" stroke-width="2"/>
    <text x="50" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00bfa6" text-anchor="middle">Rich Text</text>
  </g>

  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="90" height="32" rx="16" fill="#6bd3ff" opacity="0.2" stroke="#6bd3ff" stroke-width="2"/>
    <text x="45" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6bd3ff" text-anchor="middle">Media</text>
  </g>

  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#00bfa6" opacity="0.2" stroke="#00bfa6" stroke-width="2"/>
    <text x="60" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00bfa6" text-anchor="middle">Interactive</text>
  </g>

  <!-- Main title -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#gradient2)" text-anchor="middle">
    Blog Showcase
  </text>

  <!-- Subtitle -->
  <text x="600" y="595" font-family="Arial, sans-serif" font-size="20" fill="#99a1ad" text-anchor="middle">
    Complete Feature Guide &amp; Style Reference
  </text>

  <!-- Decorative elements -->
  <circle cx="950" cy="100" r="4" fill="#00bfa6" opacity="0.6" filter="url(#glow)"/>
  <circle cx="1050" cy="150" r="6" fill="#6bd3ff" opacity="0.4" filter="url(#glow)"/>
  <circle cx="100" cy="550" r="5" fill="#00bfa6" opacity="0.5" filter="url(#glow)"/>
  <circle cx="1100" cy="580" r="4" fill="#6bd3ff" opacity="0.6" filter="url(#glow)"/>
</svg>
