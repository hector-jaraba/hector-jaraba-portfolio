<!-- Gmail-safe, ready for inserting a Google-hosted image -->
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    color: #111111;
    font:
      14px/1.5 -apple-system,
      Segoe UI,
      Roboto,
      Arial,
      sans-serif;
  "
>
  <tr>
    <!-- LEFT: Logo container (click here and use Gmail's Insert image) -->
    <td style="vertical-align: middle; padding-right: 16px">
      <!-- Light chip keeps a dark logo visible in dark mode too -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td
            style="
              width: 100px;
              height: 100px;
              line-height: 100px;
              text-align: center;
              color: #9ca3af;
              font-size: 12px;
            "
          >
            <!-- After pasting this signature:
                 1) Click here
                 2) Click "Insert image" in Gmail toolbar
                 3) Choose from Google Drive/Photos
                 4) Set size to ~100×100 for crisp display (upload a 200×200 or 400×400 image for retina) -->
            Add&nbsp;logo
          </td>
        </tr>
      </table>
    </td>

    <!-- RIGHT: Info -->
    <td style="vertical-align: middle">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="font-weight: 600; font-size: 16px; padding-bottom: 4px; color: #111111">
            Héctor&nbsp;Jaraba
          </td>
        </tr>
        <tr>
          <td style="padding-bottom: 10px; color: #374151">Senior Frontend Engineer</td>
        </tr>
        <tr>
          <td style="padding-bottom: 6px">
            <!-- Link color: deep indigo charcoal (#2B2640) — AAA on white and dark UIs -->
            <a href="mailto:hi@hectorjaraba.com" style="color: #2b2640; text-decoration: none"
              >hi@hectorjaraba.com</a
            >
            &nbsp;|&nbsp;
            <a
              href="https://www.hectorjaraba.com"
              target="_blank"
              style="color: #2b2640; text-decoration: none"
              >hectorjaraba.com</a
            >
            &nbsp;|&nbsp;
            <a
              href="https://www.linkedin.com/in/hjaraba"
              target="_blank"
              style="color: #2b2640; text-decoration: none"
              >LinkedIn</a
            >
          </td>
        </tr>
        <tr>
          <td style="font-size: 12px; color: #4b5563">Valencia, Spain</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
